<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: radial-gradient(circle at 15% 30%, #0A0F1C, #03060C); min-height: 100vh; overflow-x: hidden; color: #EFF3F8; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1E2432; border-radius: 12px; }
    ::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 12px; }
    .app-bar { position: fixed; top: 0; left: 0; right: 0; background: rgba(12, 18, 28, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(59, 130, 246, 0.25); padding: 14px 24px; display: flex; align-items: center; justify-content: center; z-index: 1100; }
    .menu-icon { position: absolute; left: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(59,130,246,0.4); border-radius: 40px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; color: #E0E7FF; transition: all 0.2s; }
    .menu-icon:hover { background: #3B82F6; border-color: #3B82F6; color: white; }
    .app-title { font-size: 1.7rem; font-weight: 700; background: linear-gradient(135deg, #FFFFFF, #93C5FD, #60A5FA); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .drawer { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: rgba(10, 15, 25, 0.96); backdrop-filter: blur(28px); z-index: 1200; transition: left 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2); border-right: 1px solid rgba(59,130,246,0.3); display: flex; flex-direction: column; }
    .drawer.open { left: 0; }
    .drawer-header { padding: 32px 24px 20px; border-bottom: 1px solid rgba(59,130,246,0.2); text-align: left; }
    .drawer-header h3 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(125deg, #E0E7FF, #3B82F6); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: left; }
    .drawer-nav { display: flex; flex-direction: column; gap: 8px; padding: 20px 16px; flex: 1; overflow-y: auto; }
    .drawer-nav button { background: rgba(30,36,50,0.6); border: none; text-align: left; padding: 14px 20px; font-size: 0.95rem; font-weight: 500; border-radius: 28px; cursor: pointer; color: #E2E8F0; width: 100%; backdrop-filter: blur(4px); transition: 0.2s; display: flex; align-items: center; gap: 12px; }
    .drawer-nav button:hover { background: #3B82F6; color: white; transform: translateX(6px); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1150; visibility: hidden; opacity: 0; transition: 0.25s; }
    .overlay.active { visibility: visible; opacity: 1; }
    .main-content { margin-top: 90px; padding: 24px 20px 56px; max-width: 1400px; margin-left: auto; margin-right: auto; }
    .page { display: none; animation: fadeSlideUp 0.35s ease; }
    .active-page { display: block; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: rgba(18,24,36,0.75); backdrop-filter: blur(18px); border-radius: 2rem; padding: 28px 26px; margin-bottom: 32px; border: 1px solid rgba(59,130,246,0.25); transition: 0.2s; }
    .card:hover { border-color: rgba(59,130,246,0.5); transform: translateY(-2px); }
    .card h2 { font-size: 1.7rem; font-weight: 700; margin-bottom: 24px; border-left: 4px solid #3B82F6; padding-left: 18px; background: linear-gradient(135deg, #FFFFFF, #A5C9FF); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: left; }
    .form-group { margin-bottom: 22px; text-align: center; }
    label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: #9CA3AF; text-align: left; max-width: 520px; margin-left: auto; margin-right: auto; }
    input, select, textarea { width: 100%; max-width: 520px; margin: 0 auto; padding: 12px 18px; background: #0E121F; border: 1.5px solid #2D3348; border-radius: 40px; font-size: 0.9rem; color: #F1F5F9; display: block; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 4px rgba(59,130,246,0.2); }
    button { border: none; padding: 12px 28px; border-radius: 60px; font-weight: 600; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 10px; justify-content: center; backdrop-filter: blur(4px); transition: all 0.2s; }
    .btn-primary { background: linear-gradient(105deg, #2563EB, #3B82F6); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-success { background: linear-gradient(105deg, #059669, #10B981); color: white; }
    .btn-warning { background: linear-gradient(105deg, #D97706, #F59E0B); color: white; }
    .btn-danger { background: linear-gradient(105deg, #DC2626, #EF4444); color: white; }
    .btn-outline { background: rgba(30,36,50,0.7); border: 1px solid #3B82F6; color: #E2E8F0; }
    .small-btn { padding: 8px 18px; font-size: 0.7rem; }
    .center-buttons { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
    .summary-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin: 28px 0; }
    .summary-box { background: rgba(12,18,28,0.8); border-radius: 2rem; flex: 1; min-width: 150px; padding: 24px 12px; text-align: center; border: 1px solid rgba(59,130,246,0.3); }
    .summary-box p { font-size: 1.9rem; font-weight: 800; margin-top: 8px; color: white; }
    .table-wrapper { overflow-x: auto; border-radius: 1.5rem; background: rgba(10,14,22,0.6); padding: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 580px; }
    th, td { padding: 14px 12px; text-align: center; border-bottom: 1px solid #2D3348; }
    th { background: #111827; font-weight: 700; color: #94A3B8; }
    td { color: #E2E8F0; }
    .badge { padding: 4px 14px; border-radius: 60px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
    .badge-paid { background: #10B981; color: white; }
    .badge-pending { background: #F97316; color: white; }
    .badge-partial { background: #FACC15; color: #0F172A; }
    .chart-container { max-width: 340px; margin: 20px auto; background: rgba(0,0,0,0.3); border-radius: 2rem; padding: 16px; }
    .filter-bar { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 28px; background: rgba(0,0,0,0.35); border-radius: 60px; padding: 16px 20px; justify-content: center; }
    .file-row, .file-preview-item { background: rgba(16,22,34,0.9); border-radius: 2rem; padding: 14px 18px; margin: 12px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border: 1px solid #2D3348; gap: 12px; }
    .method-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 28px; }
    .method-btn { padding: 10px 28px; border-radius: 60px; background: #1E2432; color: #E2E8F0; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .method-btn.active { background: #3B82F6; color: white; box-shadow: 0 0 12px #3B82F6; }
    .login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #0F172A; border-radius: 3rem; padding: 48px 32px; text-align: center; max-width: 420px; width: 90%; border: 1px solid #3B82F6; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1E293B; backdrop-filter: blur(20px); color: white; padding: 12px 28px; border-radius: 60px; z-index: 1300; font-size: 0.85rem; opacity: 0; transition: 0.2s; pointer-events: none; border-left: 4px solid #3B82F6; }
    .toast.show { opacity: 1; }
    .progress-bar { background: #2D3348; border-radius: 60px; height: 8px; margin: 20px 0; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #3B82F6, #06B6D4); border-radius: 60px; }
    .row-2cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
    .row-5cols { display: grid; grid-template-columns: repeat(5,1fr); gap: 15px; }
    @media (max-width:700px){ .row-2cols, .row-5cols{ grid-template-columns:1fr; } }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .action-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .dropdown-list { position: absolute; background: #1E2432; border-radius: 1rem; max-height: 200px; overflow-y: auto; z-index: 100; width: 100%; }
    .search-dropdown { position: relative; max-width: 520px; margin: 0 auto; }
    .exam-history-card { background: #111927; border-radius: 1.5rem; padding: 1rem; min-width: 240px; border-left: 4px solid #3B82F6; }
    .history-horizontal { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 20px; padding: 15px 5px; }
    .header-with-buttons { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 110px; }
    .filter-group label { font-size: 0.7rem; margin: 0; text-align: center; }
    .filter-group select, .filter-group input { width: 140px; margin: 0; }
  </style>

<body>
<div class="app-bar"><button class="menu-icon" id="menuToggleBtn">☰</button><span class="app-title">FinMate Pro • Complete Fixed</span></div>
<div class="drawer" id="drawer"><div class="drawer-header"><h3>✦ MASTER HUB</h3><div class="flex-between" style="margin-top:12px;"><span>🔁 Auto Sync</span><input type="checkbox" id="autoSyncToggle" checked style="width:auto;"><button id="clearLocalHistoryBtn" class="btn-danger small-btn">🧹 Clear Local</button></div></div><div class="drawer-nav" id="drawerNav"></div></div>
<div class="overlay" id="overlay"></div>
<div class="main-content" id="mainContent"></div>
<div id="toastMsg" class="toast"></div>

<script>
// ==================== ORIGINAL CONFIGURATION & DATA ====================
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzPz7M1NuLdL9Qh64qvMhcb-9AjcFsAO238wRYqNvEkgRJVO7Ml4Dptl3orO5CTY0N/exec";
const FIXED_PASSWORD = "2024";
let autoSyncEnabled = true, isLoggedIn = false;

// ==================== DATA STORAGE ====================
let expenses = [], loans = [], contacts = [], notes = [], transactions = [], scheduledReminders = [], credentials = [], miscItems = [], examHistory = [];
let chart, analysisChart, editingTransId, editingContactId, editingNoteId, editingCredId, editingExpenseId, editingMiscId, editingExamId = null;
let mediaFilesQueue = [];
let selectedCommMethod = 'email';

function showToast(msg, isErr = false) { let t = document.getElementById('toastMsg'); if(!t) return; t.innerText = msg; t.style.backgroundColor = isErr ? "#DC2626" : "#0F172A"; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }
function escapeHtml(s) { return String(s || '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function saveAll() { 
  localStorage.setItem('expenses_final', JSON.stringify(expenses)); 
  localStorage.setItem('loans_final', JSON.stringify(loans)); 
  localStorage.setItem('contacts_final', JSON.stringify(contacts)); 
  localStorage.setItem('notes_final', JSON.stringify(notes)); 
  localStorage.setItem('transactions_final', JSON.stringify(transactions)); 
  localStorage.setItem('scheduledReminders', JSON.stringify(scheduledReminders)); 
  localStorage.setItem('credentials_final', JSON.stringify(credentials)); 
  localStorage.setItem('miscItems_final', JSON.stringify(miscItems)); 
  localStorage.setItem('examHistory_final', JSON.stringify(examHistory)); 
}
function loadData() { 
  expenses = JSON.parse(localStorage.getItem('expenses_final') || '[]').map(e => ({ ...e, paymentMethod: e.paymentMethod || 'Cash' })); 
  loans = JSON.parse(localStorage.getItem('loans_final') || '[]'); 
  contacts = JSON.parse(localStorage.getItem('contacts_final') || '[]'); 
  notes = JSON.parse(localStorage.getItem('notes_final') || '[]'); 
  transactions = JSON.parse(localStorage.getItem('transactions_final') || '[]'); 
  scheduledReminders = JSON.parse(localStorage.getItem('scheduledReminders') || '[]'); 
  credentials = JSON.parse(localStorage.getItem('credentials_final') || '[]'); 
  miscItems = JSON.parse(localStorage.getItem('miscItems_final') || '[]'); 
  examHistory = JSON.parse(localStorage.getItem('examHistory_final') || '[]'); 
}
async function verifyPassword() { let pwd = prompt("🔐 Enter master password:"); if(pwd === FIXED_PASSWORD) return true; showToast("Wrong password", true); return false; }

// ==================== API FUNCTIONS (unchanged) ====================
function jsonpRequest(params, callback) {
  const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
  window[callbackName] = function(data) { delete window[callbackName]; if(script && script.parentNode) document.body.removeChild(script); callback(data); };
  let url = GOOGLE_SCRIPT_URL + '?';
  for (let key in params) url += encodeURIComponent(key) + '=' + encodeURIComponent(params[key]) + '&';
  url += 'callback=' + callbackName;
  const script = document.createElement('script'); script.src = url; document.body.appendChild(script);
}
function listFilesInFolder(folderName, callback) { jsonpRequest({ action: 'listFiles', folder: folderName }, (data) => { if(data && data.status === 'success' && data.files) callback(data.files); else callback([]); }); }
function deleteFileFromFolder(folderName, filename, callback) { jsonpRequest({ action: 'delete', folder: folderName, filename: filename }, (data) => { callback(data && data.status === 'success'); }); }
function getFileData(folderName, filename, callback) { jsonpRequest({ action: 'getFile', folder: folderName, filename: filename }, (data) => { if(data && data.status === 'success') callback(data); else callback(null); }); }
function uploadSingleFile(folder, file, customName, overwrite, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result.split(',')[1];
    fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: overwrite ? 'uploadOverwrite' : 'upload', folder: folder, filename: customName, mimeType: file.type, data: base64 }) }).then(() => { callback(true); }).catch(() => callback(false));
  };
  reader.onerror = () => callback(false);
  reader.readAsDataURL(file);
}
function manualSyncToSheet(sheetName, records) { if(!records.length){ showToast("No data to sync", true); return; } fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sheet: sheetName, records: records }) }).then(() => showToast(`✅ ${sheetName} synced`)).catch(() => showToast("Sync failed", true)); }

// ==================== DASHBOARD ====================
function updateDashboard() { 
  document.getElementById('dashTotalExpense').innerHTML = `₹${expenses.reduce((s,e)=>s+e.amount,0).toFixed(2)}`; 
  let totalLent = loans.filter(l=>l.type==='lent' && l.status!=='paid').reduce((s,l)=>s+l.amount,0); 
  let totalBorrowed = loans.filter(l=>l.type==='borrowed' && l.status!=='paid').reduce((s,l)=>s+l.amount,0); 
  let pendingReceive = loans.filter(l=>l.type==='lent' && l.status==='pending').reduce((s,l)=>s+l.amount,0); 
  document.getElementById('dashTotalLent').innerHTML = `₹${totalLent.toFixed(2)}`; 
  document.getElementById('dashTotalBorrowed').innerHTML = `₹${totalBorrowed.toFixed(2)}`; 
  document.getElementById('dashPendingReceive').innerHTML = `₹${pendingReceive.toFixed(2)}`; 
  let cat={}; expenses.forEach(e=>cat[e.category]=(cat[e.category]||0)+e.amount); 
  if(chart) chart.destroy(); 
  let ctx = document.getElementById('expensePieChart');
  if(ctx) chart = new Chart(ctx, { type:'pie', data:{ labels:Object.keys(cat), datasets:[{ data:Object.values(cat), backgroundColor:['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] } }); 
}

// ==================== EXPENSES (with update navigation) ====================
function renderExpenses() { 
  let tbody = document.querySelector('#expenseTable tbody'); if(!tbody) return; tbody.innerHTML = ''; 
  expenses.forEach(exp => { let row = tbody.insertRow(); row.insertCell(0).innerText = exp.person; row.insertCell(1).innerText = exp.category; row.insertCell(2).innerHTML = `₹${exp.amount.toFixed(2)}`; row.insertCell(3).innerText = exp.date; row.insertCell(4).innerText = exp.time || '-'; row.insertCell(5).innerText = exp.paymentMethod || 'Cash'; row.insertCell(6).innerText = exp.note || '-'; let act = row.insertCell(7); act.className = 'action-buttons'; let edit = document.createElement('button'); edit.innerText = '✏️'; edit.className = 'small-btn btn-warning'; edit.onclick = () => { navigateToPage('expenseAddPage'); startEditExpense(exp.id); }; let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => deleteRecordLocal(exp.id, 'expenses', renderExpenses, updateDashboard, () => manualSyncToSheet('Expenses', expenses)); act.append(edit, del); }); populateAnalysisFilters(); }
function startEditExpense(id){ let e = expenses.find(x=>x.id===id); if(e){ editingExpenseId = id; document.getElementById('expensePerson').value = e.person; document.getElementById('expenseDate').value = e.date; document.getElementById('expenseTime').value = e.time || ''; document.getElementById('expenseAmount').value = e.amount; document.getElementById('expenseCategory').value = e.category; document.getElementById('expensePaymentMethod').value = e.paymentMethod || 'Cash'; document.getElementById('expenseNote').value = e.note || ''; document.getElementById('addExpenseBtn').innerText = '✏️ Update Expense'; document.getElementById('cancelExpenseEditBtn').style.display = 'inline-block'; } }
function cancelExpenseEdit(){ editingExpenseId = null; document.getElementById('expensePerson').value = ''; document.getElementById('expenseDate').value = new Date().toISOString().slice(0,10); document.getElementById('expenseTime').value = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); document.getElementById('expenseAmount').value = ''; document.getElementById('expenseCategory').value = 'Food'; document.getElementById('expensePaymentMethod').value = 'Cash'; document.getElementById('expenseNote').value = ''; document.getElementById('addExpenseBtn').innerText = '💾 Save Expense'; document.getElementById('cancelExpenseEditBtn').style.display = 'none'; }
function addOrUpdateExpense() { 
  let person = document.getElementById('expensePerson').value; 
  let amt = parseFloat(document.getElementById('expenseAmount').value); 
  if(!person || isNaN(amt)){ alert("Person & Amount required"); return; } 
  let exp = { id: editingExpenseId || Date.now(), person, amount: amt, category: document.getElementById('expenseCategory').value, date: document.getElementById('expenseDate').value, time: document.getElementById('expenseTime').value, paymentMethod: document.getElementById('expensePaymentMethod').value, note: document.getElementById('expenseNote').value }; 
  let wasEditing = (editingExpenseId !== null);
  if(editingExpenseId){ 
    let idx = expenses.findIndex(e=>e.id===editingExpenseId); 
    if(idx !== -1) expenses[idx] = exp; 
    editingExpenseId = null; 
  } else { 
    expenses.push(exp); 
  } 
  saveAll(); 
  renderExpenses(); 
  updateDashboard(); 
  showToast("Expense saved"); 
  cancelExpenseEdit(); 
  if(autoSyncEnabled) manualSyncToSheet('Expenses', expenses); 
  if(wasEditing) navigateToPage('expenseListPage');
  // if new entry, stay on same page for continuous entry
}

// ==================== LOANS (original) ====================
function renderLoans(){ 
  let tbody = document.querySelector('#loanTable tbody'); 
  if(!tbody) return; 
  tbody.innerHTML = ''; 
  loans.forEach(loan => { 
    let row = tbody.insertRow(); 
    row.insertCell(0).innerText = loan.type === 'lent' ? '📤 Lent' : '📥 Borrowed'; 
    row.insertCell(1).innerText = loan.counterparty; 
    row.insertCell(2).innerHTML = `₹${loan.amount.toFixed(2)}`; 
    row.insertCell(3).innerText = loan.purpose || '-'; 
    row.insertCell(4).innerText = loan.date || '-'; 
    row.insertCell(5).innerText = loan.dueDate || '-'; 
    row.insertCell(6).innerHTML = loan.status === 'paid' ? '<span class="badge-paid">Paid</span>' : '<span class="badge-pending">Pending</span>'; 
    row.insertCell(7).innerText = loan.paymentDate || '-'; 
    let act = row.insertCell(8); 
    act.className = 'action-buttons'; 
    if(loan.status !== 'paid'){ 
      let paidBtn = document.createElement('button'); 
      paidBtn.innerText = '✅ Mark Paid'; 
      paidBtn.className = 'small-btn btn-success'; 
      paidBtn.onclick = () => { 
        let d = prompt("Payment date (YYYY-MM-DD):", new Date().toISOString().slice(0,10)); 
        if(d){ 
          loan.status = 'paid'; 
          loan.paymentDate = d; 
          saveAll(); 
          renderLoans(); 
          updateDashboard(); 
          if(autoSyncEnabled) manualSyncToSheet('Loans', loans); 
          showToast(`Marked as paid on ${d}`); 
        } 
      }; 
      act.appendChild(paidBtn); 
    } else {
      let pendingBtn = document.createElement('button'); 
      pendingBtn.innerText = '↩️ Mark Pending'; 
      pendingBtn.className = 'small-btn btn-outline'; 
      pendingBtn.onclick = () => { 
        loan.status = 'pending'; 
        loan.paymentDate = ''; 
        saveAll(); 
        renderLoans(); 
        updateDashboard(); 
        if(autoSyncEnabled) manualSyncToSheet('Loans', loans); 
        showToast(`Marked as pending`); 
      }; 
      act.appendChild(pendingBtn); 
    }
    let edit = document.createElement('button'); 
    edit.innerText = '✏️'; 
    edit.className = 'small-btn btn-warning'; 
    edit.onclick = () => { 
      navigateToPage('loanAddPage'); 
      startEditLoan(loan.id); 
    }; 
    let del = document.createElement('button'); 
    del.innerText = '🗑️'; 
    del.className = 'small-btn btn-danger'; 
    del.onclick = () => deleteRecordLocal(loan.id, 'loans', renderLoans, updateDashboard, () => manualSyncToSheet('Loans', loans)); 
    act.append(edit, del); 
  }); 
}
function startEditLoan(id){ let l = loans.find(x=>x.id===id); if(l) { document.getElementById('transactionType').value = l.type; document.getElementById('counterpartyName').value = l.counterparty; document.getElementById('loanAmount').value = l.amount; document.getElementById('loanPurpose').value = l.purpose || ''; document.getElementById('loanDate').value = l.date || new Date().toISOString().slice(0,10); document.getElementById('loanTime').value = l.time || ''; document.getElementById('loanDueDate').value = l.dueDate || ''; window._editingLoanId = id; document.getElementById('saveLoanBtn').innerText = '✏️ Update Loan'; if(!document.getElementById('cancelLoanEditBtn')) { const cancelBtn = document.createElement('button'); cancelBtn.id = 'cancelLoanEditBtn'; cancelBtn.className = 'btn-outline'; cancelBtn.innerText = '❌ Cancel Edit'; cancelBtn.onclick = cancelLoanEdit; document.getElementById('saveLoanBtn').parentNode.appendChild(cancelBtn); } else document.getElementById('cancelLoanEditBtn').style.display = 'inline-block'; } }

function addOrUpdateLoan() { 
  let cp = document.getElementById('counterpartyName').value.trim(); 
  let amt = document.getElementById('loanAmount').value; 
  let due = document.getElementById('loanDueDate').value; 
  if(!cp || !amt || !due){ 
    alert("Required fields missing"); 
    return; 
  } 
  if(window._editingLoanId) { 
    let idx = loans.findIndex(l=>l.id===window._editingLoanId); 
    if(idx!==-1) { 
      loans[idx] = { 
        ...loans[idx], 
        type: document.getElementById('transactionType').value, 
        counterparty: cp, 
        amount: Number(amt), 
        purpose: document.getElementById('loanPurpose').value, 
        date: document.getElementById('loanDate').value, 
        time: document.getElementById('loanTime').value, 
        dueDate: due 
      }; 
      saveAll(); 
      renderLoans(); 
      updateDashboard(); 
      showToast("Loan updated"); 
      cancelLoanEdit(); 
      if(autoSyncEnabled) manualSyncToSheet('Loans', loans); 
      navigateToPage('loanListPage'); 
    } 
  } else { 
    loans.push({ 
      id: Date.now(), 
      type: document.getElementById('transactionType').value, 
      counterparty: cp, 
      amount: Number(amt), 
      purpose: document.getElementById('loanPurpose').value, 
      date: document.getElementById('loanDate').value, 
      time: document.getElementById('loanTime').value, 
      dueDate: due, 
      status: 'pending', 
      paymentDate: '' 
    }); 
    saveAll(); 
    renderLoans(); 
    updateDashboard(); 
    showToast("Transaction saved"); 
    document.getElementById('counterpartyName').value = ''; 
    document.getElementById('loanAmount').value = ''; 
    document.getElementById('loanPurpose').value = ''; 
    document.getElementById('loanDueDate').value = ''; 
    if(autoSyncEnabled) manualSyncToSheet('Loans', loans); 
    navigateToPage('loanListPage'); 
  } 
}

// ==================== COMMUNICATION (original) ====================
function updateCommContactSelect() { 
  let container = document.getElementById('commContactDropdownContainer'); 
  if(!container) return; 
  container.innerHTML = `<div class="search-dropdown"><input type="text" id="commContactSearch" placeholder="Search contacts by name, email or phone..." autocomplete="off" style="width:100%;"/><div id="commContactDropdownList" class="dropdown-list" style="display:none;"></div></div>`; 
  document.getElementById('commContactSearch').addEventListener('input', (e) => renderCommContactDropdown(e.target.value)); 
  document.getElementById('commContactSearch').addEventListener('focus', () => renderCommContactDropdown(''));
}
function renderCommContactDropdown(filter) { 
  let dropdown = document.getElementById('commContactDropdownList'); 
  if(!dropdown) return; 
  let filtered = contacts.filter(c => {
    let searchTerm = filter.toLowerCase();
    return c.name.toLowerCase().includes(searchTerm) || 
           (c.email && c.email.toLowerCase().includes(searchTerm)) || 
           (c.phone && c.phone.includes(searchTerm));
  }); 
  dropdown.innerHTML = ''; 
  if(filtered.length === 0) {
    dropdown.innerHTML = '<div style="padding:10px; text-align:center;">No contacts found</div>';
    dropdown.style.display = 'block';
    return;
  }
  filtered.forEach(c => { 
    let displayValue = selectedCommMethod === 'email' ? c.email : c.phone;
    if(displayValue) {
      let div = document.createElement('div'); 
      div.style.padding = "12px 16px"; 
      div.style.cursor = "pointer"; 
      div.style.borderBottom = "1px solid #2D3348"; 
      div.style.transition = "background 0.2s";
      div.innerHTML = `<strong>${escapeHtml(c.name)}</strong><br><small style="color:#94A3B8;">${escapeHtml(displayValue)}</small>`; 
      div.onmouseover = () => div.style.background = "#2D3348";
      div.onmouseout = () => div.style.background = "transparent";
      div.onclick = () => { 
        let manual = document.getElementById('commManualInput'); 
        let current = manual.value.trim();
        if(current) manual.value = current + ', ' + displayValue;
        else manual.value = displayValue;
        dropdown.style.display = 'none'; 
        document.getElementById('commContactSearch').value = '';
        showToast(`Added ${c.name}`);
      }; 
      dropdown.appendChild(div); 
    }
  }); 
  dropdown.style.display = 'block'; 
  document.addEventListener('click', function(e) {
    let searchInput = document.getElementById('commContactSearch');
    if(searchInput && !searchInput.contains(e.target) && !dropdown.contains(e.target)) dropdown.style.display = 'none';
  });
}
function getCommRecipients() { 
  let manual = document.getElementById('commManualInput').value; 
  return manual.split(',').map(s => s.trim()).filter(s => s); 
}
async function sendCommNow() { 
  let recipients = getCommRecipients(); 
  if(!recipients.length){ alert("Add recipients"); return; } 
  let subject = document.getElementById('commSubject').value.trim(); 
  let message = document.getElementById('commMessage').value.trim(); 
  if(!message){ alert("Message empty"); return; } 
  if(selectedCommMethod === 'email'){ 
    showToast(`Sending email to ${recipients.length} recipient(s)...`);
    for(let r of recipients) {
      await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'sendEmail', to:r, subject, body:message }) });
    }
    showToast(`Email sent to ${recipients.length} recipient(s)`); 
  } else { 
    showToast(`Sending WhatsApp to ${recipients.length} number(s)...`);
    let formattedMessage = subject ? `*${subject}*\n\n${message}` : message;
    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ action: 'sendWhatsApp', phones: recipients, message: formattedMessage }) 
      });
      const result = await response.json();
      if(result.status === 'success') showToast(`WhatsApp sent to ${recipients.length} number(s)`);
      else showToast(`WhatsApp failed: ${result.message}`, true);
    } catch(err) {
      showToast(`WhatsApp send error: ${err.message}`, true);
    }
  } 
}
function scheduleComm() { 
  let recipients = getCommRecipients(); 
  let date = document.getElementById('commDate').value; 
  let time = document.getElementById('commTime').value; 
  if(!recipients.length || !date || !time){ alert("Recipients & datetime required"); return; } 
  let scheduledTime = new Date(`${date}T${time}`).toISOString(); 
  scheduledReminders.push({ id: Date.now(), method: selectedCommMethod, recipients, subject: document.getElementById('commSubject').value, message: document.getElementById('commMessage').value, scheduledTime, sent: false }); 
  saveAll(); renderScheduledReminders(); showToast("Scheduled"); 
  document.getElementById('commDate').value = ''; document.getElementById('commTime').value = ''; document.getElementById('commSubject').value = ''; document.getElementById('commMessage').value = ''; document.getElementById('commManualInput').value = '';
}
function renderScheduledReminders(){ 
  let container = document.getElementById('scheduledRemindersList'); 
  if(!container) return; 
  container.innerHTML = ''; 
  if(!scheduledReminders.length){ container.innerHTML = '<p class="badge">No scheduled messages</p>'; return; } 
  [...scheduledReminders].reverse().forEach(r => { 
    let div = document.createElement('div'); 
    div.style.background = '#111927'; div.style.borderRadius = '1.5rem'; div.style.padding = '1rem'; div.style.marginBottom = '12px'; 
    let methodEmoji = r.method === 'email' ? '📧' : '📱'; 
    div.innerHTML = `<div><strong>${methodEmoji} ${r.recipients?.join(', ')}</strong> <span class="badge ${r.sent ? 'badge-paid' : 'badge-pending'}">${r.sent ? 'Sent' : 'Pending'}</span></div><div>📅 ${new Date(r.scheduledTime).toLocaleString()}</div><div><strong>${escapeHtml(r.subject)}</strong></div><div>${escapeHtml(r.message.substring(0,70))}</div><div class="action-buttons" style="margin-top:10px;">${!r.sent ? `<button class="small-btn btn-success cancel-reminder" data-id="${r.id}">❌ Cancel</button>` : ''}<button class="small-btn btn-danger delete-reminder" data-id="${r.id}">🗑️ Delete</button></div>`; 
    container.appendChild(div); 
  }); 
  document.querySelectorAll('.cancel-reminder').forEach(btn => btn.onclick = () => { scheduledReminders = scheduledReminders.filter(s => s.id !== parseInt(btn.dataset.id)); saveAll(); renderScheduledReminders(); showToast("Cancelled"); }); 
  document.querySelectorAll('.delete-reminder').forEach(btn => btn.onclick = () => { scheduledReminders = scheduledReminders.filter(s => s.id !== parseInt(btn.dataset.id)); saveAll(); renderScheduledReminders(); showToast("Removed"); }); 
}
function checkAndFireReminders() { 
  let now = new Date(); 
  scheduledReminders.forEach(r => { 
    if(!r.sent && new Date(r.scheduledTime) <= now) { 
      (async() => { 
        if(r.method === 'email'){ 
          for(let email of r.recipients) await fetch(GOOGLE_SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'sendEmail', to:email, subject:r.subject, body:r.message }) }); 
        } else { 
          let formattedMessage = r.subject ? `*${r.subject}*\n\n${r.message}` : r.message;
          await fetch(GOOGLE_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'sendWhatsApp', phones:r.recipients, message:formattedMessage }) }); 
        } 
        r.sent = true; saveAll(); renderScheduledReminders(); showToast(`Reminder sent`); 
      })(); 
    } 
  }); 
}

function renderMediaQueue() { 
  let container = document.getElementById('selectedFilesPreview'); if(!container) return; 
  container.innerHTML = ''; 
  mediaFilesQueue.forEach((item, idx) => { 
    let div = document.createElement('div'); div.className = 'file-preview-item'; 
    div.innerHTML = `<span>📄 ${item.file.name} (${(item.file.size/1024).toFixed(1)} KB)</span><input type="text" value="${item.customName}" class="rename-queue-input" data-index="${idx}" style="width:200px;"><button class="small-btn btn-danger remove-queue-item" data-index="${idx}">✖ Remove</button>`; 
    container.appendChild(div); 
  }); 
  document.querySelectorAll('.rename-queue-input').forEach(inp => inp.addEventListener('change', (e) => { let idx = parseInt(inp.dataset.index); if(!isNaN(idx) && mediaFilesQueue[idx]) mediaFilesQueue[idx].customName = inp.value.trim() || mediaFilesQueue[idx].file.name; })); 
  document.querySelectorAll('.remove-queue-item').forEach(btn => btn.addEventListener('click', (e) => { let idx = parseInt(btn.dataset.index); if(!isNaN(idx)) { mediaFilesQueue.splice(idx,1); renderMediaQueue(); } }));

function addFilesToQueue(newFiles) { for(let f of newFiles) mediaFilesQueue.push({ file: f, customName: f.name }); renderMediaQueue(); showToast(`${newFiles.length} file(s) added.`); }
function clearMediaQueue() { mediaFilesQueue = []; renderMediaQueue(); showToast("Queue cleared."); }
async function uploadAllQueuedFiles() { 
  let folder = document.getElementById('customFolderName').value.trim() || document.getElementById('presetFolderSelect').value || "FinMate_Uploads"; 
  let overwrite = document.getElementById('overwriteCheckbox')?.checked || false; 
  if(!mediaFilesQueue.length){ showToast("No files in queue!", true); return; } 
  let statusDiv = document.getElementById('multiUploadStatus'); let prog = document.getElementById('multiProgressFill'); 
  statusDiv.innerText = "Uploading..."; prog.style.width = "0%"; let success = 0; 
  for(let i=0; i<mediaFilesQueue.length; i++){ 
    let item = mediaFilesQueue[i]; let finalName = item.customName || item.file.name; 
    statusDiv.innerText = `Uploading (${i+1}/${mediaFilesQueue.length}): ${finalName}`; 
    await new Promise((resolve) => { uploadSingleFile(folder, item.file, finalName, overwrite, (result) => { if(result) success++; resolve(); }); }); 
    prog.style.width = ((i+1)/mediaFilesQueue.length * 100)+"%"; 
  } 
  statusDiv.innerText = `✅ ${success}/${mediaFilesQueue.length} files uploaded to "${folder}"`; 
  showToast(`Uploaded ${success} files`); mediaFilesQueue = []; renderMediaQueue(); refreshFileList(); prog.style.width = "0%"; 
}
async function refreshFileList() { 
  if(!(await verifyPassword())) return;
  let folder = document.getElementById('currentManageFolder').value.trim() || "FinMate_Uploads"; 
  document.getElementById('currentManageFolder').value = folder; 
  listFilesInFolder(folder, (files) => { 
    const container = document.getElementById('fileListContainer'); if(!container) return; 
    container.innerHTML = ''; 
    if(!files.length){ container.innerHTML = '<div class="badge">📂 No files in this folder</div>'; return; } 
    files.forEach(file => { 
      const div = document.createElement('div'); div.className = 'file-row'; 
      div.innerHTML = `<span>📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)</span><div class="action-buttons"><button class="small-btn btn-primary view-file-btn" data-name="${file.name}">👁️ View</button><button class="small-btn btn-success download-file-btn" data-name="${file.name}">⬇️ Download</button><button class="small-btn btn-warning rename-file-btn" data-name="${file.name}">✏️ Rename</button><button class="small-btn btn-danger delete-file-btn" data-name="${file.name}">🗑️ Delete</button></div>`; 
      container.appendChild(div); 
    }); 
    document.querySelectorAll('.view-file-btn').forEach(btn => { 
      btn.onclick = () => { 
        let filename = btn.dataset.name; 
        getFileData(folder, filename, (data) => { 
          if(data && data.content && data.mimeType) { 
            const byteCharacters = atob(data.content);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: data.mimeType });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            URL.revokeObjectURL(url);
          } else showToast("Cannot view file", true); 
        }); 
      }; 
    }); 
    document.querySelectorAll('.download-file-btn').forEach(btn => { 
      btn.onclick = () => { 
        let filename = btn.dataset.name; 
        getFileData(folder, filename, (data) => { 
          if(data && data.content && data.mimeType) { 
            const byteCharacters = atob(data.content);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: data.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
          } else showToast("Download failed", true); 
        }); 
      }; 
    }); 
    document.querySelectorAll('.rename-file-btn').forEach(btn => { btn.onclick = async () => { if(!(await verifyPassword())) return; let oldName = btn.dataset.name; let newName = prompt("New name:", oldName); if(newName && newName !== oldName) { jsonpRequest({ action: 'rename', folder: folder, oldName: oldName, newName: newName }, (data) => { if(data && data.status === 'success'){ showToast(`Renamed to ${newName}`); refreshFileList(); } else showToast("Rename failed", true); }); } }; }); 
    document.querySelectorAll('.delete-file-btn').forEach(btn => { btn.onclick = async () => { if(!(await verifyPassword())) return; let filename = btn.dataset.name; if(confirm(`Delete "${filename}" permanently?`)) { deleteFileFromFolder(folder, filename, (success) => { if(success){ showToast("🗑️ Deleted"); refreshFileList(); } else showToast("Delete failed", true); }); } }; }); 
  }); 
}

  if(!(await verifyPassword())) return; 
  let arr; 
  if(arrayName === 'expenses') arr = expenses; else if(arrayName === 'loans') arr = loans; else if(arrayName === 'contacts') arr = contacts; else if(arrayName === 'notes') arr = notes; else if(arrayName === 'transactions') arr = transactions; else if(arrayName === 'credentials') arr = credentials; else if(arrayName === 'misc') arr = miscItems; else if(arrayName === 'examHistory') arr = examHistory; else return;

  saveAll(); if(renderFunc) renderFunc(); if(updateFunc) updateFunc(); showToast("Deleted locally"); if(syncFunc && autoSyncEnabled) syncFunc();

  } 
}

`; }

// ==================== LOGIN & INIT (unchanged) ====================
function showLoginModal() { 
  const modalDiv = document.createElement('div'); modalDiv.id = 'loginModal'; modalDiv.className = 'login-modal'; 
  modalDiv.innerHTML = `<div class="login-card"><h2>🔐 FinMate Pro</h2><input type="password" id="loginPassword" placeholder="Password" style="background:#0E121F; color:white;"><div class="center-buttons"><button id="loginSubmitBtn" class="btn-primary">Unlock</button></div></div>`; 
  document.body.appendChild(modalDiv); 
  document.getElementById('loginSubmitBtn').onclick = () => { 
    let pwd = document.getElementById('loginPassword').value; 
    if(pwd === FIXED_PASSWORD){ 
      isLoggedIn = true; modalDiv.remove(); 
      document.getElementById('appContainer').classList.remove('hidden-content'); 
      initApp(); showToast("Login successful"); 
    } else showToast("Wrong password", true); 
  }; 
}
const originalBody = document.body.innerHTML; 
document.body.innerHTML = `<div id="appContainer" class="hidden-content">${originalBody}</div>`; 
showLoginModal();

function initApp() { 
  renderAllPages(); buildDrawer(); loadData(); 
  let todayDate = new Date().toISOString().slice(0,10); let nowTime = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }); 
  if(document.getElementById('expenseDate')) document.getElementById('expenseDate').value = todayDate; 
  if(document.getElementById('expenseTime')) document.getElementById('expenseTime').value = nowTime; 
  if(document.getElementById('loanDate')) document.getElementById('loanDate').value = todayDate; 
  if(document.getElementById('loanTime')) document.getElementById('loanTime').value = nowTime; 
  if(document.getElementById('tpTransactionDate')) document.getElementById('tpTransactionDate').value = todayDate; 
  renderExpenses(); renderLoans(); renderTransactions(); renderContacts(); renderNotes(); renderCredentials(); renderMisc(); 
  updateDashboard(); renderExamHistory(); renderScheduledReminders(); populateAnalysisFilters(); renderAnalysis(); 
  setInterval(checkAndFireReminders, 30000); 
  
  const autoToggle = document.getElementById('autoSyncToggle'); 
  autoToggle.checked = autoSyncEnabled; 
  autoToggle.onchange = () => { autoSyncEnabled = autoToggle.checked; showToast(autoSyncEnabled ? "Auto Sync ON" : "Auto Sync OFF"); }; 
  document.getElementById('clearLocalHistoryBtn').onclick = clearAllLocalData; 
  
  document.getElementById('addExpenseBtn').onclick = addOrUpdateExpense; 
  document.getElementById('cancelExpenseEditBtn').onclick = cancelExpenseEdit; 
  document.getElementById('saveContactBtn').onclick = addOrUpdateContact; 
  document.getElementById('saveNoteBtn').onclick = addOrUpdateNote; 
  document.getElementById('saveTransactionBtn').onclick = addOrUpdateTransaction; 
  document.getElementById('cancelTransactionEditBtn').onclick = cancelEditTransaction; 
  document.getElementById('saveCredBtn').onclick = addOrUpdateCredential; 
  document.getElementById('saveMiscBtn').onclick = addOrUpdateMisc; 
  document.getElementById('cancelMiscEditBtn').onclick = cancelMiscEdit; 
  document.getElementById('scheduleCommBtn').onclick = scheduleComm; 
  document.getElementById('sendNowCommBtn').onclick = sendCommNow; 
  document.getElementById('tpQuantity').addEventListener('input', autoCalcAmount); 
  document.getElementById('tpRate').addEventListener('input', autoCalcAmount); 
  document.getElementById('saveLoanBtn').onclick = addOrUpdateLoan; 
  
  document.getElementById('syncExpensesSheetBtn').onclick = () => manualSyncToSheet('Expenses', expenses); 
  document.getElementById('syncLoansSheetBtn').onclick = () => manualSyncToSheet('Loans', loans); 
  document.getElementById('syncContactsSheetBtn').onclick = () => manualSyncToSheet('Contacts', contacts); 
  document.getElementById('syncNotesSheetBtn').onclick = () => manualSyncToSheet('Notes', notes); 
  document.getElementById('syncTransactionsSheetBtn').onclick = () => manualSyncToSheet('Transactions', transactions); 
  document.getElementById('syncCredentialsSheetBtn').onclick = () => manualSyncToSheet('AppCredentials', credentials); 
  document.getElementById('syncMiscSheetBtn').onclick = () => manualSyncToSheet('Miscellaneous', miscItems); 
  document.getElementById('syncExamToSheetBtn').onclick = () => manualSyncToSheet('ExamFormsData', examHistory); 
  
  // ========== MODIFIED: Password-protected load from sheet ==========
  async function loadSheetData(sheetName, target, render, update) {
    if(!(await verifyPassword())) return;
    if(!confirm(`Load ${sheetName}? This will REPLACE current data.`)) return;
    jsonpRequest({ sheet: sheetName }, (data) => {
      if(data && data.records) {
        if(target === 'expenses') { expenses = data.records.map(r=>({...r, paymentMethod: r.paymentMethod || 'Cash'})); saveAll(); if(render) render(); if(update) update(); populateAnalysisFilters(); showToast(`Loaded ${expenses.length} expenses`); }
        else if(target === 'loans') { loans = data.records; saveAll(); if(render) render(); if(update) update(); showToast(`Loaded ${loans.length} loans`); }
        else if(target === 'contacts') { contacts = data.records; saveAll(); if(render) render(); updateCommContactSelect(); showToast(`Loaded ${contacts.length} contacts`); }
        else if(target === 'notes') { notes = data.records; saveAll(); if(render) render(); showToast(`Loaded ${notes.length} notes`); }
        else if(target === 'transactions') { transactions = data.records; saveAll(); if(render) render(); showToast(`Loaded ${transactions.length} transactions`); }
        else if(target === 'credentials') { credentials = data.records; saveAll(); if(render) render(); showToast(`Loaded ${credentials.length} credentials`); }
        else if(target === 'misc') { miscItems = data.records; saveAll(); if(render) render(); showToast(`Loaded ${miscItems.length} misc entries`); }
        else if(target === 'examHistory') { examHistory = data.records; saveAll(); if(render) render(); showToast(`Loaded ${examHistory.length} exam records`); }
      } else showToast("No data", true);
    });
  }
  
  document.getElementById('loadExpensesFromSheet').onclick = () => loadSheetData('Expenses', 'expenses', renderExpenses, updateDashboard);
  document.getElementById('loadLoansFromSheet').onclick = () => loadSheetData('Loans', 'loans', renderLoans, updateDashboard);
  document.getElementById('loadContactsFromSheet').onclick = () => loadSheetData('Contacts', 'contacts', renderContacts, null);
  document.getElementById('loadNotesFromSheet').onclick = () => loadSheetData('Notes', 'notes', renderNotes, null);
  document.getElementById('loadTransactionsFromSheet').onclick = () => loadSheetData('Transactions', 'transactions', renderTransactions, null);
  document.getElementById('loadCredentialsFromSheet').onclick = () => loadSheetData('AppCredentials', 'credentials', renderCredentials, null);
  document.getElementById('loadMiscFromSheet').onclick = () => loadSheetData('Miscellaneous', 'misc', renderMisc, null);
  document.getElementById('loadExamFromSheetBtn').onclick = () => loadSheetData('ExamFormsData', 'examHistory', renderExamHistory, null);
  
  document.getElementById('applyAnalysisFilter').onclick = renderAnalysis; 
  document.getElementById('resetAnalysisFilter').onclick = resetAnalysisFilters; 
  document.getElementById('submitExamFormBtn').onclick = submitOrUpdateExam; 
  document.getElementById('cancelExamEditBtn').onclick = cancelExamEdit; 
  
  const emailBtn = document.getElementById('emailMethodBtn'); const whatsappBtn = document.getElementById('whatsappMethodBtn'); 
  if(emailBtn && whatsappBtn) { 
    emailBtn.onclick = () => { selectedCommMethod = 'email'; emailBtn.classList.add('active'); whatsappBtn.classList.remove('active'); document.getElementById('commManualInput').placeholder = "Email addresses (comma separated)"; updateCommContactSelect(); }; 
    whatsappBtn.onclick = () => { selectedCommMethod = 'whatsapp'; whatsappBtn.classList.add('active'); emailBtn.classList.remove('active'); document.getElementById('commManualInput').placeholder = "WhatsApp numbers with country code (comma separated)"; updateCommContactSelect(); }; 
  } 
  updateCommContactSelect(); 
  
  const dropzone = document.getElementById('multiDropzone'); const fileInput = document.getElementById('multiFileInput'); 
  if(dropzone && fileInput){ 
    dropzone.onclick = () => fileInput.click(); 
    dropzone.ondragover = e => { e.preventDefault(); dropzone.style.borderColor = '#3B82F6'; }; 
    dropzone.ondragleave = () => { dropzone.style.borderColor = '#3B82F6'; }; 
    dropzone.ondrop = e => { e.preventDefault(); addFilesToQueue(Array.from(e.dataTransfer.files)); }; 
    fileInput.onchange = e => { addFilesToQueue(Array.from(e.target.files)); fileInput.value = ''; }; 
  } 
  document.getElementById('uploadAllFilesBtn').onclick = uploadAllQueuedFiles; 
  document.getElementById('clearQueueBtn').onclick = clearMediaQueue; 
  document.getElementById('refreshFileListBtn').onclick = () => refreshFileList(); 
  
  const drawer = document.getElementById('drawer'); const overlay = document.getElementById('overlay'); 
  document.getElementById('menuToggleBtn').onclick = () => { drawer.classList.add('open'); overlay.classList.add('active'); }; 
  overlay.onclick = () => { drawer.classList.remove('open'); overlay.classList.remove('active'); }; 
  
  navigateToPage('dashboardPage'); 
}
</script>
