<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FinMate Pro • Family Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Inter', sans-serif; }
    body { background: radial-gradient(circle at 10% 30%, #eef2ff, #e0e7ff); overflow-x: hidden; }
    .app-bar { position: fixed; top:0; left:0; right:0; background: rgba(15,23,42,0.8); backdrop-filter: blur(16px); color: white; padding: 14px 24px; display: flex; align-items: center; gap: 20px; z-index: 1100; box-shadow: 0 12px 30px rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); }
    .menu-icon { font-size: 26px; background: rgba(255,255,255,0.15); border: none; color: white; cursor: pointer; border-radius: 60px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: 0.25s; }
    .menu-icon:hover { background: rgba(255,255,255,0.3); transform: scale(0.96); }
    .app-title { font-size: 1.7rem; font-weight: 800; background: linear-gradient(125deg, #FFFFFF, #a5f3fc, #c4b5fd); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .drawer { position: fixed; top:0; left:-320px; width:320px; height:100%; background: rgba(255,255,255,0.98); backdrop-filter: blur(18px); z-index:1200; transition: left 0.35s cubic-bezier(0.2,0.9,0.4,1.1); box-shadow: 12px 0 35px rgba(0,0,0,0.2); border-right: 1px solid rgba(255,255,255,0.6); display: flex; flex-direction: column; }
    .drawer.open { left: 0; }
    .drawer-header { padding: 32px 24px 20px; border-bottom: 1px solid #eef2ff; background: linear-gradient(135deg, #f8fafc, #ffffff); }
    .drawer-header h3 { font-size: 2rem; background: linear-gradient(135deg, #2563eb, #9333ea); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
    .drawer-nav { display: flex; flex-direction: column; gap: 10px; padding: 20px 18px; flex:1; overflow-y: auto; }
    .drawer-nav button { background: rgba(255,255,255,0.7); border: none; text-align: left; padding: 14px 20px; font-size: 1rem; font-weight: 600; border-radius: 60px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; color: #1e293b; }
    .drawer-nav button:hover { background: linear-gradient(105deg, #ffffff, #eef2ff); transform: translateX(8px); box-shadow: 0 10px 20px -8px rgba(0,0,0,0.15); color: #2563eb; }
    .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index:1150; visibility: hidden; opacity:0; transition: 0.2s; }
    .overlay.active { visibility: visible; opacity:1; }
    .main-content { margin-top: 84px; padding: 24px 20px 40px; max-width: 1400px; margin-left: auto; margin-right: auto; }
    .page { display: none; animation: fadeUp 0.3s ease; }
    .active-page { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .card { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-radius: 48px; padding: 28px; margin-bottom: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.6); }
    .card h2 { font-size: 1.8rem; margin-bottom: 24px; border-left: 8px solid #3b82f6; padding-left: 22px; background: linear-gradient(120deg, #1e293b, #334155); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.85rem; color: #1e293b; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 14px 18px; border: 1px solid #cbd5e1; border-radius: 48px; font-size: 0.95rem; background: white; outline: none; text-align: center; }
    input:focus, select:focus, textarea:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139,92,246,0.2); }
    .row-2cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .row-5cols { display: grid; grid-template-columns: repeat(5,1fr); gap: 15px; }
    button { border: none; padding: 12px 28px; border-radius: 60px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-primary { background: linear-gradient(105deg, #3b82f6, #7c3aed); color: white; box-shadow: 0 8px 18px rgba(59,130,246,0.4); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 25px -8px #3b82f6; }
    .btn-success { background: linear-gradient(105deg, #10b981, #047857); color: white; }
    .btn-warning { background: linear-gradient(105deg, #f59e0b, #ea580c); color: white; }
    .btn-danger { background: linear-gradient(105deg, #ef4444, #dc2626); color: white; }
    .btn-outline { background: white; border: 1px solid #cbd5e1; color: #1f2937; }
    .small-btn { padding: 6px 14px; font-size: 0.7rem; border-radius: 40px; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    .summary-grid { display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .summary-box { background: rgba(255,255,255,0.9); flex:1; min-width:150px; padding:20px; border-radius:32px; text-align:center; box-shadow: 0 12px 20px -12px rgba(0,0,0,0.1); border:1px solid rgba(255,255,255,0.7); }
    .badge { background: #eef2ff; padding: 5px 14px; border-radius: 60px; font-size: 0.7rem; font-weight:600; }
    .badge-paid { background: #10b981; color: white; }
    .badge-pending { background: linear-gradient(135deg, #f97316, #dc2626); color: white; }
    .badge-partial { background: linear-gradient(135deg, #facc15, #eab308); color: #1e293b; }
    .table-wrapper { overflow-x: auto; margin-top: 18px; border-radius: 32px; background: #ffffffcc; padding: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 14px 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; font-weight: 700; color: #0f172a; text-align: center; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #0f172ae6; backdrop-filter: blur(10px); color: white; padding: 14px 28px; border-radius: 80px; z-index: 1300; font-size: 0.85rem; opacity:0; transition:0.2s; pointer-events: none; }
    .toast.show { opacity:1; }
    .chart-container { max-width: 350px; margin: 20px auto; }
    .progress-bar { background: #e2e8f0; border-radius: 40px; height: 10px; margin: 16px 0; overflow: hidden; }
    .progress-fill { width:0%; height:100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.3s; }
    .file-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .preview-item { background: #eef2ff; border-radius: 60px; padding: 6px 12px; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 8px; }
    .filter-bar { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end; }
    .filter-group { flex:1; min-width:150px; }
    .filter-group label { font-size:0.7rem; margin-bottom:4px; }
    @media (max-width:700px){ .row-2cols{ grid-template-columns:1fr; } .row-5cols{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app-bar"><button class="menu-icon" id="menuToggleBtn">✨</button><span class="app-title">FinMate Pro</span></div>
<div class="drawer" id="drawer"><div class="drawer-header"><h3>🏠 MASTER HUB</h3></div><div class="drawer-nav" id="drawerNav"></div></div>
<div class="overlay" id="overlay"></div>
<div class="main-content" id="mainContent"></div>
<div id="toastMsg" class="toast"></div>

<script>
  // ==================== CONFIG ====================
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4mJtILOHd0Ei7Y1HF3UKs9DszjniveUqjzmL-Hshlh1Rx72d_UCQDyA61AVXV-TP4LA/exec"; // CHANGE THIS
  
  // ==================== DATA ====================
  let expenses = [], loans = [], contacts = [], notes = [], transactions = [], scheduledReminders = [], credentials = [], miscItems = [];
  let chart, analysisChart, editingTransId, editingContactId, editingNoteId, editingCredId, editingExpenseId, editingMiscId;
  let mediaFiles = [], recentFolders = JSON.parse(localStorage.getItem('recentFolders') || '[]');

  // ==================== HELPER FUNCTIONS ====================
  function showToast(msg, isErr = false) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.style.backgroundColor = isErr ? "#dc2626" : "#0f172a"; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function saveRecentFolders() { localStorage.setItem('recentFolders', JSON.stringify(recentFolders)); }
  function addRecentFolder(name) { if (!name) return; recentFolders = recentFolders.filter(f => f !== name); recentFolders.unshift(name); if (recentFolders.length > 10) recentFolders.pop(); saveRecentFolders(); updateRecentFoldersDropdown(); }
  function updateRecentFoldersDropdown() { let sel = document.getElementById('recentFoldersSelect'); if (!sel) return; sel.innerHTML = '<option value="">-- Recent Folders --</option>'; recentFolders.forEach(f => { sel.innerHTML += `<option value="${f}">📁 ${f}</option>`; }); }
  function loadData() {
    expenses = JSON.parse(localStorage.getItem('expenses_final') || '[]').map(e => ({ ...e, paymentMethod: e.paymentMethod || 'Cash' }));
    loans = JSON.parse(localStorage.getItem('loans_final') || '[]'); loans.forEach(l => { l.status = l.status || 'pending'; l.paymentDate = l.paymentDate || ''; });
    contacts = JSON.parse(localStorage.getItem('contacts_final') || '[]');
    notes = JSON.parse(localStorage.getItem('notes_final') || '[]');
    transactions = JSON.parse(localStorage.getItem('transactions_final') || '[]').map(t => ({ ...t, transactionDate: t.transactionDate || t.paymentDate || '', dueAmount: t.dueAmount !== undefined ? t.dueAmount : (t.dueDate ? parseFloat(t.dueDate) : 0) }));
    scheduledReminders = JSON.parse(localStorage.getItem('scheduledReminders') || '[]');
    credentials = JSON.parse(localStorage.getItem('credentials_final') || '[]');
    miscItems = JSON.parse(localStorage.getItem('miscItems_final') || '[]');
    notes.forEach(n => { if (!n.purpose) n.purpose = ''; });
  }
  function saveAll() {
    localStorage.setItem('expenses_final', JSON.stringify(expenses));
    localStorage.setItem('loans_final', JSON.stringify(loans));
    localStorage.setItem('contacts_final', JSON.stringify(contacts));
    localStorage.setItem('notes_final', JSON.stringify(notes));
    localStorage.setItem('transactions_final', JSON.stringify(transactions));
    localStorage.setItem('scheduledReminders', JSON.stringify(scheduledReminders));
    localStorage.setItem('credentials_final', JSON.stringify(credentials));
    localStorage.setItem('miscItems_final', JSON.stringify(miscItems));
  }
  function updateDashboard() {
    document.getElementById('dashTotalExpense').innerHTML = `₹${expenses.reduce((s, e) => s + e.amount, 0).toFixed(2)}`;
    let totalLent = loans.filter(l => l.type === 'lent' && l.status !== 'paid').reduce((s, l) => s + l.amount, 0);
    let totalBorrowed = loans.filter(l => l.type === 'borrowed' && l.status !== 'paid').reduce((s, l) => s + l.amount, 0);
    let pendingReceive = loans.filter(l => l.type === 'lent' && l.status === 'pending').reduce((s, l) => s + l.amount, 0);
    document.getElementById('dashTotalLent').innerHTML = `₹${totalLent.toFixed(2)}`;
    document.getElementById('dashTotalBorrowed').innerHTML = `₹${totalBorrowed.toFixed(2)}`;
    document.getElementById('dashPendingReceive').innerHTML = `₹${pendingReceive.toFixed(2)}`;
    let cat = {}; expenses.forEach(e => cat[e.category] = (cat[e.category] || 0) + e.amount);
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('expensePieChart'), { type: 'pie', data: { labels: Object.keys(cat), datasets: [{ data: Object.values(cat), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] }] } });
  }
function populateAnalysisPersonDropdown() {
  const select = document.getElementById('analysisPerson');
  if (!select) return;
  const uniqueNames = [...new Set(expenses.map(e => e.person).filter(p => p && p.trim() !== ''))];
  const currentValue = select.value;
  select.innerHTML = '<option value="">All</option>';
  uniqueNames.forEach(name => {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    if (name === currentValue) option.selected = true;
    select.appendChild(option);
  });
}

  // ==================== RENDER FUNCTIONS ====================
  function renderExpenses() { let tbody = document.querySelector('#expenseTable tbody'); if (!tbody) return; tbody.innerHTML = ''; expenses.forEach(exp => { let row = tbody.insertRow(); row.insertCell(0).innerText = exp.person; row.insertCell(1).innerText = exp.category; row.insertCell(2).innerHTML = `₹${exp.amount.toFixed(2)}`; row.insertCell(3).innerText = exp.date; row.insertCell(4).innerText = exp.time || '-'; row.insertCell(5).innerText = exp.paymentMethod || 'Cash'; row.insertCell(6).innerText = exp.note || '-'; let act = row.insertCell(7); let edit = document.createElement('button'); edit.innerText = '✏️'; edit.className = 'small-btn btn-warning'; edit.onclick = () => startEditExpense(exp.id); let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => { expenses = expenses.filter(e => e.id !== exp.id); saveAll(); renderExpenses(); updateDashboard();populateAnalysisPersonDropdown(); showToast("Deleted"); }; act.appendChild(edit); act.appendChild(del); });populateAnalysisPersonDropdown(); }
  function renderLoans() { let tbody = document.querySelector('#loanTable tbody'); if (!tbody) return; tbody.innerHTML = ''; loans.forEach(loan => { let row = tbody.insertRow(); row.insertCell(0).innerText = loan.type === 'lent' ? '📤 Lent' : '📥 Borrowed'; row.insertCell(1).innerText = loan.counterparty; row.insertCell(2).innerHTML = `₹${loan.amount.toFixed(2)}`; row.insertCell(3).innerText = loan.purpose || '-'; row.insertCell(4).innerText = loan.date || '-'; row.insertCell(5).innerText = loan.dueDate || '-'; row.insertCell(6).innerHTML = loan.status === 'paid' ? '<span class="badge-paid">Paid</span>' : '<span class="badge-pending">Pending</span>'; row.insertCell(7).innerText = loan.paymentDate || '-'; let act = row.insertCell(8); if (loan.status === 'pending') { let paid = document.createElement('button'); paid.innerText = '✅ Mark Paid'; paid.className = 'small-btn btn-success'; paid.onclick = () => { let d = prompt("Payment date (YYYY-MM-DD):", new Date().toISOString().slice(0, 10)); if (d) { loan.status = 'paid'; loan.paymentDate = d; saveAll(); renderLoans(); updateDashboard(); showToast(`Paid on ${d}`); } }; act.appendChild(paid); } else { let pend = document.createElement('button'); pend.innerText = '↩️ Pending'; pend.className = 'small-btn btn-outline'; pend.onclick = () => { loan.status = 'pending'; loan.paymentDate = ''; saveAll(); renderLoans(); updateDashboard(); showToast("Pending"); }; act.appendChild(pend); } let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => { loans = loans.filter(l => l.id !== loan.id); saveAll(); renderLoans(); updateDashboard(); showToast("Deleted"); }; act.appendChild(del); }); }
  function renderTransactions() { let tbody = document.querySelector('#transactionsTable tbody'); if (!tbody) return; tbody.innerHTML = ''; if (!transactions.length) { let row = tbody.insertRow(); let cell = row.insertCell(0); cell.colSpan = 11; cell.innerText = 'No transactions yet.'; cell.style.textAlign = 'center'; return; } transactions.forEach(t => { let row = tbody.insertRow(); row.insertCell(0).innerText = t.type || '-'; row.insertCell(1).innerText = t.party || '-'; row.insertCell(2).innerText = t.qty || '0'; row.insertCell(3).innerText = t.rate || '0'; row.insertCell(4).innerHTML = `₹${(t.amount || 0).toFixed(2)}`; row.insertCell(5).innerText = t.transactionDate || '-'; row.insertCell(6).innerHTML = `₹${(t.dueAmount || 0).toFixed(2)}`; row.insertCell(7).innerText = t.dueClearDate || '-'; let cls = t.status === 'Paid' ? 'badge-paid' : (t.status === 'Partial' ? 'badge-partial' : 'badge-pending'); row.insertCell(8).innerHTML = `<span class="${cls}">${t.status || 'Due'}</span>`; row.insertCell(9).innerText = t.remarks || '-'; let act = row.insertCell(10); let edit = document.createElement('button'); edit.innerText = '✏️'; edit.className = 'small-btn btn-warning'; edit.onclick = () => startEditTransaction(t.id); let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => { transactions = transactions.filter(tr => tr.id !== t.id); saveAll(); renderTransactions(); showToast("Deleted"); }; act.appendChild(edit); act.appendChild(del); }); }
  function renderContacts() { let tbody = document.querySelector('#contactsTable tbody'); if (!tbody) return; tbody.innerHTML = ''; contacts.forEach(c => { let row = tbody.insertRow(); row.insertCell(0).innerText = c.name; row.insertCell(1).innerText = c.email; row.insertCell(2).innerText = c.phone || ''; row.insertCell(3).innerText = c.address || ''; row.insertCell(4).innerText = c.relation || ''; let act = row.insertCell(5); let edit = document.createElement('button'); edit.innerText = '✏️'; edit.className = 'small-btn btn-warning'; edit.onclick = () => startEditContact(c.id); let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => { contacts = contacts.filter(con => con.id !== c.id); saveAll(); renderContacts(); updateContactSelect(); showToast("Deleted"); }; act.appendChild(edit); act.appendChild(del); }); }
  function renderNotes() { let tbody = document.querySelector('#notesTable tbody'); if (!tbody) return; tbody.innerHTML = ''; if (!notes.length) { let row = tbody.insertRow(); let cell = row.insertCell(0); cell.colSpan = 4; cell.innerText = 'No notes yet.'; cell.style.textAlign = 'center'; return; } notes.forEach(n => { let row = tbody.insertRow(); row.insertCell(0).innerText = n.date; row.insertCell(1).innerText = n.purpose || '—'; row.insertCell(2).innerText = n.content; let act = row.insertCell(3); let edit = document.createElement('button'); edit.innerText = '✏️'; edit.className = 'small-btn btn-warning'; edit.onclick = () => startEditNote(n.id); let pdf = document.createElement('button'); pdf.innerText = '📄 PDF'; pdf.className = 'small-btn btn-primary'; pdf.onclick = () => printNoteAsPDF(n); let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => { notes = notes.filter(note => note.id !== n.id); saveAll(); renderNotes(); showToast("Note deleted"); }; act.appendChild(edit); act.appendChild(pdf); act.appendChild(del); }); }
  function renderCredentials() { let tbody = document.querySelector('#credentialsTable tbody'); if (!tbody) return; tbody.innerHTML = ''; credentials.forEach(c => { let row = tbody.insertRow(); row.insertCell(0).innerText = c.name; row.insertCell(1).innerText = c.appId; row.insertCell(2).innerText = c.password; row.insertCell(3).innerText = c.type; row.insertCell(4).innerText = c.description || '-'; let act = row.insertCell(5); let edit = document.createElement('button'); edit.innerText = '✏️'; edit.className = 'small-btn btn-warning'; edit.onclick = () => startEditCredential(c.id); let del = document.createElement('button'); del.innerText = '🗑️'; del.className = 'small-btn btn-danger'; del.onclick = () => { credentials = credentials.filter(cred => cred.id !== c.id); saveAll(); renderCredentials(); showToast("Deleted"); }; act.appendChild(edit); act.appendChild(del); }); }
  function renderAnalysis() { let filtered = [...expenses]; let person = document.getElementById('analysisPerson').value; let method = document.getElementById('analysisPaymentMethod').value; let month = document.getElementById('analysisMonth').value; let from = document.getElementById('analysisFromDate').value; let to = document.getElementById('analysisToDate').value; if (person) filtered = filtered.filter(e => e.person === person); if (method) filtered = filtered.filter(e => e.paymentMethod === method); if (month) filtered = filtered.filter(e => e.date.startsWith(month)); if (from) filtered = filtered.filter(e => e.date >= from); if (to) filtered = filtered.filter(e => e.date <= to); let total = filtered.reduce((s, e) => s + e.amount, 0); document.getElementById('analysisTotalAmount').innerHTML = `Total: ₹${total.toFixed(2)}`; document.getElementById('analysisFilterInfo').innerHTML = `Records: ${filtered.length}`; let tbody = document.querySelector('#analysisTable tbody'); if (tbody) { tbody.innerHTML = ''; filtered.forEach(e => { let row = tbody.insertRow(); row.insertCell(0).innerText = e.date; row.insertCell(1).innerText = e.person; row.insertCell(2).innerText = e.category; row.insertCell(3).innerHTML = `₹${e.amount.toFixed(2)}`; row.insertCell(4).innerText = e.paymentMethod || 'Cash'; row.insertCell(5).innerText = e.note || '-'; }); } let catMap = {}; filtered.forEach(e => catMap[e.category] = (catMap[e.category] || 0) + e.amount); if (analysisChart) analysisChart.destroy(); let ctx = document.getElementById('analysisChart').getContext('2d'); analysisChart = new Chart(ctx, { type: 'bar', data: { labels: Object.keys(catMap), datasets: [{ label: 'Amount (₹)', data: Object.values(catMap), backgroundColor: '#3b82f6' }] } }); }
  function renderScheduledReminders() { let container = document.getElementById('scheduledRemindersList'); if (!container) return; container.innerHTML = ''; if (!scheduledReminders.length) { container.innerHTML = '<p class="badge">No reminders yet</p>'; return; } [...scheduledReminders].reverse().forEach(r => { let div = document.createElement('div'); div.className = 'reminder-item'; div.style.background = '#f8fafc'; div.style.borderRadius = '30px'; div.style.padding = '14px 18px'; div.style.marginBottom = '12px'; div.style.borderLeft = '5px solid #3b82f6'; div.innerHTML = `<div class="flex-between"><strong>📧 ${r.recipients ? r.recipients.join(', ') : r.email}</strong> <span class="badge ${r.sent ? 'badge-paid' : 'badge-pending'}">${r.sent ? 'Sent' : 'Pending'}</span></div><div>📅 ${new Date(r.scheduledTime).toLocaleString()}</div><div><strong>${r.subject}</strong></div><div>${r.message.substring(0, 70)}</div><div style="margin-top:10px; display:flex; gap:8px;">${!r.sent ? `<button class="small-btn btn-success cancel-reminder" data-id="${r.id}">❌ Cancel</button>` : ''}<button class="small-btn btn-danger delete-reminder" data-id="${r.id}">🗑️ Delete</button></div>`; if (!r.sent) { let cancel = div.querySelector('.cancel-reminder'); cancel.onclick = () => { scheduledReminders = scheduledReminders.filter(s => s.id !== r.id); saveAll(); renderScheduledReminders(); showToast("Cancelled"); }; } let del = div.querySelector('.delete-reminder'); del.onclick = () => { scheduledReminders = scheduledReminders.filter(s => s.id !== r.id); saveAll(); renderScheduledReminders(); showToast("Removed"); }; container.appendChild(div); }); }
  
  // ==================== MISCELLANEOUS (10 fields) ====================

  async function loadSheetData(sheetName, targetArray, renderFunc, updateDashboardFunc = null) { if (!confirm(`Load ${sheetName} from Google Sheet? This will REPLACE current local data.`)) return; try { let res = await fetch(`${GOOGLE_SCRIPT_URL}?sheet=${sheetName}`); let data = await res.json(); if (data.status === "success" && Array.isArray(data.records)) { if (targetArray === 'expenses') { expenses = data.records.map(r => ({ ...r, paymentMethod: r.paymentMethod || 'Cash' })); saveAll(); renderFunc(); if (updateDashboardFunc) updateDashboardFunc(); showToast(`Loaded ${expenses.length} expenses from sheet`); } else if (targetArray === 'loans') { loans = data.records; saveAll(); renderFunc(); if (updateDashboardFunc) updateDashboardFunc();populateAnalysisPersonDropdown();showToast(`Loaded ${loans.length} loans from sheet`); } else if (targetArray === 'contacts') { contacts = data.records; saveAll(); renderFunc(); showToast(`Loaded ${contacts.length} contacts from sheet`); } else if (targetArray === 'notes') { notes = data.records; saveAll(); renderFunc(); showToast(`Loaded ${notes.length} notes from sheet`); } else if (targetArray === 'transactions') { transactions = data.records; saveAll(); renderFunc(); showToast(`Loaded ${transactions.length} transactions from sheet`); } else if (targetArray === 'credentials') { credentials = data.records; saveAll(); renderFunc(); showToast(`Loaded ${credentials.length} credentials from sheet`); } else if (targetArray === 'misc') { miscItems = data.records; saveAll(); renderFunc(); showToast(`Loaded ${miscItems.length} misc entries from sheet`); } } else { showToast("No data found or error", true); } } catch (e) { showToast("Failed to load: " + e.message, true); } }

  function getRecipientEmails() { let sel = document.getElementById('reminderContactSelect'); let manual = document.getElementById('manualEmails').value; let emails = []; for (let opt of sel.selectedOptions) if (opt.value) emails.push(opt.value); if (manual.trim()) emails.push(...manual.split(',').map(e => e.trim()).filter(e => e)); return [...new Set(emails)]; }

  function generateAutoPDF(subject, message, scheduledTime = null) { const { jsPDF } = window.jspdf; let doc = new jsPDF(); doc.setFontSize(18); doc.text("Reminder from FinMate", 20, 20); doc.setFontSize(12); if (scheduledTime) doc.text(`Scheduled: ${scheduledTime}`, 20, 35); else doc.text(`Sent: ${new Date().toLocaleString()}`, 20, 35); doc.text(`Subject: ${subject}`, 20, 50); doc.text("Message:", 20, 65); let lines = doc.splitTextToSize(message, 170); doc.text(lines, 20, 75); doc.setFontSize(10); doc.text("Sent from ASHU & NIRAJ", 20, 85); return doc.output('datauristring').split(',')[1]; }
  function scheduleReminder() { let rec = getRecipientEmails(); if (rec.length === 0) { alert("Select at least one contact or enter manual email(s)"); return; } let date = document.getElementById('reminderDate').value, time = document.getElementById('reminderTime').value; if (!date || !time) { alert("Set date and time"); return; } let scheduledDateTime = new Date(`${date}T${time}`); if (isNaN(scheduledDateTime)) { alert("Invalid datetime"); return; } let subject = document.getElementById('reminderSubject').value.trim() || "Scheduled Reminder"; let message = document.getElementById('reminderMessage').value.trim(); if (!message) { alert("Message empty"); return; } let file = document.getElementById('attachFile').files[0]; if (file && !['application/pdf', 'image/jpeg', 'image/png', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'].includes(file.type)) { alert("Unsupported file type"); return; } let reader = new FileReader(); reader.onload = e => { scheduledReminders.push({ id: Date.now(), recipients: rec, subject, message, scheduledTime: scheduledDateTime.toISOString(), sent: false, attachedFileData: file ? e.target.result.split(',')[1] : null, attachedFileName: file ? file.name : null, attachedMimeType: file ? file.type : null }); saveAll(); renderScheduledReminders(); showToast(`⏰ Reminder scheduled for ${scheduledDateTime.toLocaleString()} to ${rec.length} recipient(s)`); document.getElementById('reminderDate').value = ''; document.getElementById('reminderTime').value = ''; document.getElementById('reminderSubject').value = ''; document.getElementById('reminderMessage').value = ''; document.getElementById('attachFile').value = ''; document.getElementById('manualEmails').value = ''; for (let opt of document.getElementById('reminderContactSelect').options) opt.selected = false; }; if (file) reader.readAsDataURL(file); else reader.onload({ target: { result: null } })(); }

  function checkAndFireReminders() { let now = new Date(); scheduledReminders.forEach(r => { if (!r.sent && new Date(r.scheduledTime) <= now) { (async () => { let fileBase64 = r.attachedFileData, fileName = r.attachedFileName, mimeType = r.attachedMimeType; if (!fileBase64) { fileBase64 = generateAutoPDF(r.subject, r.message, r.scheduledTime); fileName = `reminder_${r.id}.pdf`; mimeType = 'application/pdf'; } let recipients = r.recipients || (r.email ? [r.email] : []); let sc = 0; for (let email of recipients) { if (await sendEmailRequest(email, r.subject, r.message, fileBase64, fileName, mimeType)) sc++; } if (sc > 0) { r.sent = true; saveAll(); renderScheduledReminders(); showToast(`✅ Reminder sent to ${sc} recipient(s)`); } })(); } }); }

  window.onload = () => {

    document.getElementById('syncTransactionsSheetBtn').onclick = () => syncToSheet("Transactions", transactions);
    document.getElementById('submitExamFormBtn').onclick = submitExamForm;
    document.getElementById('saveCredBtn').onclick = addOrUpdateCredential;

    renderAnalysis();
    document.getElementById('loadExpensesFromSheet').onclick = () => loadSheetData('Expenses', 'expenses', renderExpenses, updateDashboard);
    document.getElementById('loadLoansFromSheet').onclick = () => loadSheetData('Loans', 'loans', renderLoans, updateDashboard);
    document.getElementById('loadContactsFromSheet').onclick = () => loadSheetData('Contacts', 'contacts', renderContacts, null);
    document.getElementById('loadNotesFromSheet').onclick = () => loadSheetData('Notes', 'notes', renderNotes, null);
    document.getElementById('loadTransactionsFromSheet').onclick = () => loadSheetData('Transactions', 'transactions', renderTransactions, null);
    document.getElementById('loadCredentialsFromSheet').onclick = () => loadSheetData('AppCredentials', 'credentials', renderCredentials, null);
    document.getElementById('loadMiscFromSheet').onclick = () => loadSheetData('Miscellaneous', 'misc', renderMisc, null);
    document.getElementById('syncMiscSheetBtn').onclick = () => syncToSheet("Miscellaneous", miscItems);
    document.getElementById('saveMiscBtn').onclick = addOrUpdateMisc;
    document.getElementById('cancelMiscEditBtn').onclick = cancelMiscEdit;
    let dropzone = document.getElementById('multiDropzone'), fileInput = document.getElementById('multiFileInput');

      dropzone.onclick = () => fileInput.click();
      dropzone.ondragover = e => { e.preventDefault(); dropzone.style.borderColor = '#7c3aed'; dropzone.style.background = '#ede9fe'; };
      dropzone.ondragleave = () => { dropzone.style.borderColor = '#7c3aed'; dropzone.style.background = '#f8fafc'; };
      dropzone.ondrop = e => { e.preventDefault(); dropzone.style.borderColor = '#7c3aed'; dropzone.style.background = '#f8fafc'; let items = e.dataTransfer.files; if (items.length) addFiles(Array.from(items)); };
      fileInput.onchange = e => { if (e.target.files.length) addFiles(Array.from(e.target.files)); fileInput.value = ''; };
    }
